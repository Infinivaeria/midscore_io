[package]
name = "partitioned_array_rust"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "Production-ready Rust LineDB / PartitionedArray stack with file-context persistence"
repository = "https://github.com/ZeroPivot/partitioned_array"
readme = "README.md"
keywords = ["database", "partitioned-array", "linedb", "storage"]
categories = ["database-implementations", "data-structures", "filesystem"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.13"

[package]
name = "tiade_ollama_relay"
version = "3.0.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
surf = { version = "2.3.2", default-features = true }
tide = { version = "0.16.0", features = ["docs", "unstable"] }
chrono = { version = "0.4.40", features = ["serde"] }
async-std = "1.13.0"
partitioned_array_rust = { path = "../../lib/partitioned_array_rust" }

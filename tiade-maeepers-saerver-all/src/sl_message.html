<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Message</title>
<style>
:root{--ink:#202625;--muted:#626d68;--line:#cdd7d1;--green:#14674d;--red:#a42d43;--paper:#f3f6f4}*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--paper);background-image:linear-gradient(90deg,transparent 99%,#dfe7e2 99%);background-size:64px 64px;color:var(--ink);font:16px 'Trebuchet MS',sans-serif}main{max-width:1120px;margin:auto;padding:28px 20px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:28px;margin:0;font-family:Georgia,serif}h2{font-size:18px;margin:0;overflow-wrap:anywhere}a{color:var(--green)}button,input,textarea{font:inherit;border:1px solid var(--line);border-radius:4px;padding:10px;background:white;color:var(--ink)}button{cursor:pointer;min-height:44px}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.55;cursor:wait}label{display:grid;gap:6px;font-size:14px}input,textarea{min-width:0;width:100%}input[type=color]{height:44px;width:64px;padding:4px}input[type=range]{width:120px}.toolbar{margin-top:22px;justify-content:flex-start;align-items:end}.toolbar label{flex:1;min-width:180px}#status{min-height:24px;color:var(--muted);overflow-wrap:anywhere}article{padding:22px 0;border-top:1px solid var(--line)}.heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin:8px 0}.state{color:var(--red);font-size:14px}.online{color:var(--green)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}textarea{height:92px;resize:vertical}.controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-top:10px}.incoming{border-left:3px solid var(--line);padding-left:18px;min-width:0}.incoming p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.incoming h3{font-size:13px;color:var(--muted);margin:0 0 8px}#empty{padding:36px 0;color:var(--muted)}@media(max-width:650px){main{padding:20px 14px}.layout{grid-template-columns:1fr}.toolbar button{flex:1}.controls{gap:10px}.incoming{margin-top:4px}}
</style>
<style>
.runtime{margin-top:22px;border-top:1px solid var(--line);padding-top:16px;min-width:0}.runtime summary{cursor:pointer;font-size:16px;font-weight:bold;min-height:32px}.runtime-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:12px}.runtime .switch{display:flex;align-items:center;gap:8px;min-height:44px}.switch input{width:20px;height:20px}.runtime input[type=number]{width:100px}.runtime textarea{height:180px;font:14px monospace;line-height:1.5}.runtime pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;font:13px monospace;line-height:1.5;margin:8px 0}.runtime h3{font-size:14px;margin:18px 0 8px}.runtime-message{min-height:22px;overflow-wrap:anywhere}.runtime-message.error{color:var(--red)}button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:3px}.runtime-controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.runtime-controls button{max-width:100%}.runtime-state{min-width:0}.runtime button{white-space:normal}summary::marker{color:var(--green)}@media(max-width:680px){.runtime-grid{grid-template-columns:minmax(0,1fr);gap:12px}}
</style>
<main>
  <header><h1>SL Message 2.0</h1><a href="/slmessage/script.lsl" download="sl_message.lsl">Download LSL script</a></header>
  <form class="toolbar" id="connect"><label>Admin token<input id="token" type="password" autocomplete="off" required></label><button class="primary">Connect</button><button type="button" id="disconnect">Disconnect</button></form>
  <p id="status" role="status" aria-live="polite">Disconnected</p>
  <div id="empty">No objects loaded.</div><section id="objects" aria-label="Second Life objects"></section>
</main>
<script>
(() => {
  let token = '', busy = false, connection = 0;
  const rows = new Map(), status = document.getElementById('status');
  const make = (tag, text, className) => {const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (className) node.className = className; return node;};
  async function api(path, body) {
    const response = await fetch('/slmessage/' + path, {method:body === undefined ? 'GET' : 'POST',cache:'no-store',headers:{Authorization:'Bearer ' + token,'Content-Type':'application/json'},body:body === undefined ? undefined : JSON.stringify(body)});
    if (!response.ok) {
      const message = response.status === 401 ? 'Access denied. Check the admin token.' : response.status === 409 ? 'Runtime changed. Reload state before saving again.' : (await response.text() || 'Request failed: ' + response.status);
      const error = new Error(message); error.status = response.status; throw error;
    }
    return response.json();
  }
  function showRuntime(row, object) {
    const runtime = object.runtime;
    if (row.runtime && runtime.version < row.runtime.version) return;
    row.runtime = runtime;
    row.programStatus.textContent = (runtime.paused ? 'Paused' : runtime.wake_at > Date.now()/1000 ? 'Scheduled' : 'Ready') + ' | ' + runtime.runs + ' runs | Version ' + runtime.version;
    row.lastRun.textContent = 'Last run: ' + (runtime.last_run_at ? new Date(runtime.last_run_at*1000).toLocaleString() : 'Never') + (runtime.wake_at ? ' | Wake: ' + new Date(runtime.wake_at*1000).toLocaleString() : '');
    row.logs.textContent = runtime.logs.length ? runtime.logs.join('\n') : 'No program logs.';
    if (!row.runtimeSaving) row.paused.checked = runtime.paused;
    if (!row.pollDirty) row.poll.value = runtime.poll_seconds;
    if (!row.stateDirty) {row.stateEditor.value = JSON.stringify(object.state,null,2);row.stateVersion = runtime.version;}
  }
  function runtimeControls(row, object) {
    const details = make('details',undefined,'runtime'), grid = make('div',undefined,'runtime-grid'), settings = make('div'), statePanel = make('div',undefined,'runtime-state');
    const pausedLabel = make('label','Program paused','switch'), paused = make('input'), pollLabel = make('label','Polling interval (seconds)'), poll = make('input'), applyPoll = make('button','Apply interval'), wake = make('button','Wake now'), clear = make('button','Clear logs');
    const stateLabel = make('label','Program state (JSON)'), editor = make('textarea'), save = make('button','Save state','primary'), reload = make('button','Reload state'), reset = make('button','Reset state'), stateActions = make('div',undefined,'controls');
    const message = make('p','','runtime-message'), programStatus = make('p','','meta'), lastRun = make('p','','meta'), logs = make('pre');
    message.setAttribute('role','status');message.setAttribute('aria-live','polite');
    paused.type = 'checkbox';poll.type = 'number';poll.min = '15';poll.max = '120';poll.step = '1';poll.required = true;editor.spellcheck = false;
    pausedLabel.prepend(paused);pollLabel.append(poll);stateLabel.append(editor);
    const commands = make('div',undefined,'runtime-controls');commands.append(pollLabel,applyPoll,wake,clear);
    settings.append(pausedLabel,commands,make('h3','Program log'),logs);stateActions.append(save,reload,reset);statePanel.append(stateLabel,stateActions);grid.append(settings,statePanel);
    details.append(make('summary','Program runtime'),programStatus,lastRun,grid,message);row.article.append(details);
    Object.assign(row,{paused,poll,stateEditor:editor,programStatus,lastRun,logs,runtimeMessage:message,stateDirty:false,pollDirty:false,runtimeSaving:false});
    const buttons = [applyPoll,wake,clear,save,reload,reset];
    const notify = (text,error=false) => {message.textContent = text;message.classList.toggle('error',error);};
    const lock = saving => {row.runtimeSaving = saving;paused.disabled = saving;poll.disabled = saving;editor.disabled = saving;for (const button of buttons) button.disabled = saving;};
    async function write(body,version=row.runtime.version) {
      if (row.runtimeSaving) return;
      lock(true);notify('Saving runtime...');
      try {
        const reply = await api('objects/' + encodeURIComponent(object.id) + '/runtime',{expected_version:version,...body});
        if ('state' in body || body.reset_state) row.stateDirty = false;
        if ('poll_seconds' in body) row.pollDirty = false;
        showRuntime(row,reply);notify('Runtime saved.');
      } catch (error) {notify(error.message,true);}
      finally {lock(false);row.paused.checked = row.runtime.paused;}
    }
    paused.addEventListener('change',() => write({paused:paused.checked}));
    poll.addEventListener('input',() => {row.pollDirty = true;});
    applyPoll.addEventListener('click',() => {if (poll.reportValidity()) write({poll_seconds:Number(poll.value)});});
    wake.addEventListener('click',() => write({wake_now:true}));
    clear.addEventListener('click',() => write({clear_logs:true}));
    editor.addEventListener('input',() => {row.stateDirty = true;notify('Unsaved state.');});
    save.addEventListener('click',() => {
      let state;
      try {state = JSON.parse(editor.value);if (state === null) throw new Error('Use Reset state for an empty state.');}
      catch (error) {notify('Invalid JSON: ' + error.message,true);return;}
      write({state},row.stateVersion);
    });
    reload.addEventListener('click',async () => {
      if (row.stateDirty && !window.confirm('Discard unsaved state changes?')) return;
      lock(true);
      try {const reply = await api('objects/' + encodeURIComponent(object.id) + '/runtime');row.stateDirty = false;row.pollDirty = false;showRuntime(row,reply);notify('State reloaded.');}
      catch (error) {notify(error.message,true);}
      finally {lock(false);row.paused.checked = row.runtime.paused;}
    });
    reset.addEventListener('click',() => {if (window.confirm('Reset this prim\'s saved program state and pause its program?')) write({reset_state:true,paused:true},row.stateVersion);});
    showRuntime(row,object);
  }
  function createRow(object) {
    const article = make('article'), heading = make('div', undefined, 'heading'), name = make('h2'), state = make('span', '', 'state'), meta = make('p', '', 'meta'), layout = make('div', undefined, 'layout'), form = make('form'), textLabel = make('label', 'Hover text'), text = make('textarea'), controls = make('div', undefined, 'controls'), colorLabel = make('label', 'Color'), color = make('input'), alphaLabel = make('label', 'Opacity'), alpha = make('input'), send = make('button', 'Send update', 'primary'), result = make('p', '', 'meta'), incoming = make('div', undefined, 'incoming'), reported = make('p'), message = make('p'), seen = make('p', '', 'meta');
    text.maxLength = 254; color.type = 'color'; alpha.type = 'range'; alpha.min = '0'; alpha.max = '1'; alpha.step = '.05';
    textLabel.append(text); colorLabel.append(color); alphaLabel.append(alpha); controls.append(colorLabel,alphaLabel,send); form.append(textLabel,controls,result);
    incoming.append(make('h3','Reported hover text'),reported,make('h3','Latest object message'),message,seen); heading.append(name,state); layout.append(form,incoming); article.append(heading,meta,layout);
    const row = {article,name,state,meta,text,color,alpha,reported,message,seen,result,dirty:false,revision:-1};
    runtimeControls(row,object);
    form.addEventListener('input', () => {row.dirty = true;});
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (new TextEncoder().encode(text.value).length > 254) {result.textContent = 'Text exceeds 254 UTF-8 bytes.';return;}
      send.disabled = true;
      try {const rgb = [1,3,5].map(offset => parseInt(color.value.slice(offset,offset+2),16)/255); const reply = await api('objects/' + encodeURIComponent(object.id), {text:text.value,color:rgb,alpha:Number(alpha.value)}); row.dirty = false; result.textContent = 'Queued revision ' + reply.revision; await refresh();} catch (error) {result.textContent = error.message;} finally {send.disabled = false;}
    });
    document.getElementById('objects').append(article); rows.set(object.id,row);return row;
  }
  async function refresh() {
    if (!token || busy) return;
    busy = true;
    const session = connection;
    try {
      const {objects} = await api('objects');
      if (session !== connection) return;
      for (const object of objects) {
        const row = rows.get(object.id) || createRow(object);
        if (!row.runtimeSaving) showRuntime(row,object);
        row.name.textContent = object.name || 'Unnamed prim'; row.state.textContent = (object.online ? 'Online' : 'Offline') + ' / ' + (object.revision === object.applied_revision ? 'Applied' : 'Pending'); row.state.classList.toggle('online',object.online);
        row.meta.textContent = object.region + ' | ' + object.id;
        row.reported.textContent = object.reported_text || '(empty)';row.message.textContent = object.message || '(none)';
        row.seen.textContent = object.last_seen ? 'Last seen ' + new Date(object.last_seen * 1000).toLocaleString() : 'Not seen since server restart';
        if (!row.dirty && row.revision !== object.revision) {row.text.value = object.desired.text;row.color.value = '#' + object.desired.color.map(value => Math.round(value*255).toString(16).padStart(2,'0')).join('');row.alpha.value = object.desired.alpha;row.revision = object.revision;}
      }
      document.getElementById('empty').hidden = objects.length > 0;
      status.textContent = objects.length + ' objects / ' + objects.filter(object => object.online).length + ' online';
    } catch (error) {if (session === connection) status.textContent = error.message;} finally {if (session === connection) busy = false;}
  }
  function clearConnection() {connection++;busy = false;rows.clear();document.getElementById('objects').replaceChildren();document.getElementById('empty').hidden = false;}
  document.getElementById('connect').onsubmit = event => {event.preventDefault();if ([...rows.values()].some(row => row.dirty || row.stateDirty || row.pollDirty) && !window.confirm('Discard unsaved changes and reconnect?')) return;clearConnection();token = document.getElementById('token').value;refresh();};
  document.getElementById('disconnect').onclick = () => {clearConnection();token = '';document.getElementById('token').value = '';status.textContent = 'Disconnected';};
  setInterval(refresh,5000);
})();
</script>
</html>

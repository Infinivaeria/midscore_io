<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Message</title>
<style>
:root{--ink:#202625;--muted:#626d68;--line:#cdd7d1;--green:#14674d;--red:#a42d43;--paper:#f3f6f4}*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:var(--paper);background-image:linear-gradient(90deg,transparent 99%,#dfe7e2 99%);background-size:64px 64px;color:var(--ink);font:16px 'Trebuchet MS',sans-serif}main{max-width:1120px;margin:auto;padding:28px 20px}header,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:28px;margin:0;font-family:Georgia,serif}h2{font-size:18px;margin:0;overflow-wrap:anywhere}a{color:var(--green)}button,input,textarea{font:inherit;border:1px solid var(--line);border-radius:4px;padding:10px;background:white;color:var(--ink)}button{cursor:pointer;min-height:44px}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.55;cursor:wait}label{display:grid;gap:6px;font-size:14px}input,textarea{min-width:0;width:100%}input[type=color]{height:44px;width:64px;padding:4px}input[type=range]{width:120px}.toolbar{margin-top:22px;justify-content:flex-start;align-items:end}.toolbar label{flex:1;min-width:180px}#status{min-height:24px;color:var(--muted);overflow-wrap:anywhere}article{padding:22px 0;border-top:1px solid var(--line)}.heading{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin:8px 0}.state{color:var(--red);font-size:14px}.online{color:var(--green)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}textarea{height:92px;resize:vertical}.controls{display:flex;align-items:end;gap:14px;flex-wrap:wrap;margin-top:10px}.incoming{border-left:3px solid var(--line);padding-left:18px;min-width:0}.incoming p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.incoming h3{font-size:13px;color:var(--muted);margin:0 0 8px}#empty{padding:36px 0;color:var(--muted)}@media(max-width:650px){main{padding:20px 14px}.layout{grid-template-columns:1fr}.toolbar button{flex:1}.controls{gap:10px}.incoming{margin-top:4px}}
</style>
<main>
  <header><h1>SL Message</h1><a href="/slmessage/script.lsl" download="sl_message.lsl">Download LSL script</a></header>
  <form class="toolbar" id="connect"><label>Admin token<input id="token" type="password" autocomplete="off" required></label><button class="primary">Connect</button><button type="button" id="disconnect">Disconnect</button></form>
  <p id="status" role="status" aria-live="polite">Disconnected</p>
  <div id="empty">No objects loaded.</div><section id="objects" aria-label="Second Life objects"></section>
</main>
<script>
(() => {
  let token = '', busy = false;
  const rows = new Map(), status = document.getElementById('status');
  const make = (tag, text, className) => {const node = document.createElement(tag); if (text !== undefined) node.textContent = text; if (className) node.className = className; return node;};
  async function api(path, body) {
    const response = await fetch('/slmessage/' + path, {method:body === undefined ? 'GET' : 'POST',cache:'no-store',headers:{Authorization:'Bearer ' + token,'Content-Type':'application/json'},body:body === undefined ? undefined : JSON.stringify(body)});
    if (!response.ok) throw new Error(response.status === 401 ? 'Access denied. Check the admin token.' : (await response.text() || 'Request failed: ' + response.status));
    return response.json();
  }
  function createRow(object) {
    const article = make('article'), heading = make('div', undefined, 'heading'), name = make('h2'), state = make('span', '', 'state'), meta = make('p', '', 'meta'), layout = make('div', undefined, 'layout'), form = make('form'), textLabel = make('label', 'Hover text'), text = make('textarea'), controls = make('div', undefined, 'controls'), colorLabel = make('label', 'Color'), color = make('input'), alphaLabel = make('label', 'Opacity'), alpha = make('input'), send = make('button', 'Send update', 'primary'), result = make('p', '', 'meta'), incoming = make('div', undefined, 'incoming'), reported = make('p'), message = make('p'), seen = make('p', '', 'meta');
    text.maxLength = 254; color.type = 'color'; alpha.type = 'range'; alpha.min = '0'; alpha.max = '1'; alpha.step = '.05';
    textLabel.append(text); colorLabel.append(color); alphaLabel.append(alpha); controls.append(colorLabel,alphaLabel,send); form.append(textLabel,controls,result);
    incoming.append(make('h3','Reported hover text'),reported,make('h3','Latest object message'),message,seen); heading.append(name,state); layout.append(form,incoming); article.append(heading,meta,layout);
    const row = {article,name,state,meta,text,color,alpha,reported,message,seen,result,dirty:false,revision:-1};
    form.addEventListener('input', () => {row.dirty = true;});
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (new TextEncoder().encode(text.value).length > 254) {result.textContent = 'Text exceeds 254 UTF-8 bytes.';return;}
      send.disabled = true;
      try {const rgb = [1,3,5].map(offset => parseInt(color.value.slice(offset,offset+2),16)/255); const reply = await api('objects/' + encodeURIComponent(object.id), {text:text.value,color:rgb,alpha:Number(alpha.value)}); row.dirty = false; result.textContent = 'Queued revision ' + reply.revision; await refresh();} catch (error) {result.textContent = error.message;} finally {send.disabled = false;}
    });
    document.getElementById('objects').append(article); rows.set(object.id,row);return row;
  }
  async function refresh() {
    if (!token || busy) return;
    busy = true;
    try {
      const {objects} = await api('objects');
      for (const object of objects) {
        const row = rows.get(object.id) || createRow(object);
        row.name.textContent = object.name || 'Unnamed prim'; row.state.textContent = (object.online ? 'Online' : 'Offline') + ' / ' + (object.revision === object.applied_revision ? 'Applied' : 'Pending'); row.state.classList.toggle('online',object.online);
        row.meta.textContent = object.region + ' | ' + object.id;
        row.reported.textContent = object.reported_text || '(empty)';row.message.textContent = object.message || '(none)';
        row.seen.textContent = object.last_seen ? 'Last seen ' + new Date(object.last_seen * 1000).toLocaleString() : 'Not seen since server restart';
        if (!row.dirty && row.revision !== object.revision) {row.text.value = object.desired.text;row.color.value = '#' + object.desired.color.map(value => Math.round(value*255).toString(16).padStart(2,'0')).join('');row.alpha.value = object.desired.alpha;row.revision = object.revision;}
      }
      document.getElementById('empty').hidden = objects.length > 0;
      status.textContent = objects.length + ' objects / ' + objects.filter(object => object.online).length + ' online';
    } catch (error) {status.textContent = error.message;} finally {busy = false;}
  }
  document.getElementById('connect').onsubmit = event => {event.preventDefault();token = document.getElementById('token').value;refresh();};
  document.getElementById('disconnect').onclick = () => {token = '';document.getElementById('token').value = '';rows.clear();document.getElementById('objects').replaceChildren();document.getElementById('empty').hidden = false;status.textContent = 'Disconnected';};
  setInterval(refresh,5000);
})();
</script>
</html>

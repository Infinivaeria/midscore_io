<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ollama Workbench</title>
  <style>
    :root{--ink:#17242b;--muted:#5d6b72;--paper:#f8f6ef;--panel:#fffdf8;--line:#d9d5ca;--teal:#006d77;--dark:#15242c;--red:#ae3934;--gold:#dd9c23}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(125deg,#e8f1ec,var(--paper) 50%,#faead0);font:16px Georgia,serif}button,input,select,textarea{font:inherit}.shell{width:min(1360px,calc(100% - 32px));margin:auto;padding:28px 0 42px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:0 4px 24px;border-bottom:1px solid var(--line)}h1,h2,p{margin:0}h1{font-size:32px;font-weight:normal}h2{font-size:18px;font-weight:normal}.eyebrow,label,.status,.button,.route,pre{font-family:ui-monospace,SFMono-Regular,monospace}.eyebrow{color:var(--teal);font-size:12px;font-weight:bold;margin-bottom:7px;text-transform:uppercase}.status{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;background:#999}.dot.ok{background:#219866}.dot.bad{background:var(--red)}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(330px,.8fr);gap:20px;padding-top:24px}.panel{background:#fffdf8e8;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 28px #44513a12}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.body,.stack{display:grid;gap:16px}.body{padding:18px}.row{display:flex;gap:12px;align-items:end}.row>*{flex:1;min-width:0}label{display:grid;gap:6px;color:var(--muted);font-size:12px}input,select,textarea{width:100%;color:var(--ink);background:#fffefa;border:1px solid #bec4bd;border-radius:3px;padding:9px 10px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #006d7722}textarea{min-height:86px;resize:vertical;line-height:1.45}.messages{display:grid;gap:12px}.message{border-left:4px solid var(--teal);padding-left:12px}.message.system{border-color:var(--gold)}.message.assistant{border-color:#8064a4}.message-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.message-top select{width:130px;padding:5px 7px}.button{cursor:pointer;border:1px solid var(--teal);border-radius:3px;padding:9px 13px;color:#fff;background:var(--teal);font-size:13px;font-weight:bold}.button:hover{background:#00555d}.button.secondary{color:var(--teal);background:transparent}.button.secondary:hover{color:white;background:var(--teal)}.button:disabled{cursor:wait;opacity:.55}.icon{width:32px;height:32px;padding:0;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:3px;cursor:pointer}.icon:hover{border-color:var(--line);color:var(--red)}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions .button:first-child{margin-right:auto}.notice{min-height:18px;color:var(--muted);font:12px ui-monospace,monospace}.notice.error{color:var(--red)}pre{margin:0;max-height:470px;overflow:auto;padding:14px;color:#eaf1ec;background:var(--dark);border-radius:3px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:10px;border:1px solid var(--line);border-radius:3px}.stat b{display:block;color:var(--muted);font:11px ui-monospace,monospace}.stat span{display:block;margin-top:5px;font:13px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.route-list{display:grid;gap:7px;max-height:260px;overflow:auto}.route{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #e7e3da;font-size:12px}.method{min-width:38px;color:var(--teal);font-weight:bold}.path{overflow-wrap:anywhere}details summary{cursor:pointer;color:var(--muted);font:12px ui-monospace,monospace}details pre{margin-top:10px;max-height:250px}@media(max-width:860px){.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.row{flex-direction:column;align-items:stretch}.meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">HTTPS Ollama relay</p><h1>Ollama Workbench</h1></div><div class="status"><span id="dot" class="dot"></span><span id="status">Checking relay</span></div></header>
    <section class="grid">
      <section class="panel"><div class="head"><h2>Chat Request</h2><button id="add" class="button secondary" type="button">Add message</button></div><div class="body">
        <div class="row"><label>Model<input id="model" placeholder="Uses server default"></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></label><label>Context tokens<input id="context" type="number" min="128" step="128" value="4096"></label></div>
        <div id="messages" class="messages"></div><div class="actions"><button id="send" class="button" type="button">Send to /ollama</button><button id="clear" class="button secondary" type="button">Clear</button><button id="sample" class="button secondary" type="button">Load sample</button></div><p id="notice" class="notice" aria-live="polite"></p><details><summary>Request JSON preview</summary><pre id="preview">{}</pre></details>
      </div></section>
      <aside class="stack"><section class="panel"><div class="head"><h2>Response</h2><button id="copy" class="icon" type="button" title="Copy response JSON" aria-label="Copy response JSON">[]</button></div><div class="body"><div class="meta"><div class="stat"><b>HTTP</b><span id="http">-</span></div><div class="stat"><b>Model</b><span id="reply-model">-</span></div><div class="stat"><b>Elapsed</b><span id="elapsed">-</span></div></div><pre id="response">Send a message to see the Ollama response.</pre></div></section><section class="panel"><div class="head"><h2>Relay Routes</h2><button id="refresh" class="button secondary" type="button">Refresh</button></div><div class="body"><div id="routes" class="route-list">Loading route catalog...</div></div></section></aside>
    </section>
  </main>
  <template id="message-template"><article class="message"><div class="message-top"><select aria-label="Message role"><option value="user">user</option><option value="system">system</option><option value="assistant">assistant</option></select><button class="icon remove" type="button" title="Remove message" aria-label="Remove message">x</button></div><textarea aria-label="Message content" placeholder="Write a message"></textarea></article></template>
  <script>
    const base=window.location.origin, $=s=>document.querySelector(s), els={messages:$('#messages'),model:$('#model'),temperature:$('#temperature'),context:$('#context'),preview:$('#preview'),response:$('#response'),notice:$('#notice'),send:$('#send'),dot:$('#dot'),status:$('#status'),routes:$('#routes')}, pretty=v=>JSON.stringify(v,null,2);
    function payload(){const messages=[...els.messages.querySelectorAll('.message')].map(node=>({role:node.querySelector('select').value,content:node.querySelector('textarea').value.trim()})).filter(message=>message.content);const value={messages,stream:false,options:{temperature:Number(els.temperature.value),num_ctx:Number(els.context.value)}};if(els.model.value.trim())value.model=els.model.value.trim();return value}function preview(){els.preview.textContent=pretty(payload())}function note(message='',error=false){els.notice.textContent=message;els.notice.classList.toggle('error',error)}function add(role='user',content=''){const node=$('#message-template').content.firstElementChild.cloneNode(true),select=node.querySelector('select'),textarea=node.querySelector('textarea');select.value=role;textarea.value=content;const decorate=()=>{node.classList.toggle('system',select.value==='system');node.classList.toggle('assistant',select.value==='assistant');preview()};select.addEventListener('change',decorate);textarea.addEventListener('input',preview);node.querySelector('.remove').addEventListener('click',()=>{node.remove();preview()});els.messages.append(node);decorate()}
    async function call(path,options={}){const response=await fetch(`${base}${path}`,options),text=await response.text();let body;try{body=JSON.parse(text)}catch{body={raw:text}}if(!response.ok)throw Object.assign(new Error(body.error||`HTTP ${response.status}`),{status:response.status,body});return{status:response.status,body}}
    async function send(){const data=payload();if(!data.messages.length)return note('Add at least one non-empty message.',true);els.send.disabled=true;note('Calling POST /ollama...');const began=performance.now();try{const result=await call('/ollama',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(data)});$('#http').textContent=result.status;$('#reply-model').textContent=result.body.model||data.model||'server default';els.response.textContent=pretty(result.body);note('Response received.')}catch(error){$('#http').textContent=error.status||'network';els.response.textContent=pretty(error.body||{error:error.message});note(`Request failed: ${error.message}`,true)}finally{$('#elapsed').textContent=`${Math.round(performance.now()-began)} ms`;els.send.disabled=false}}
    async function health(){try{const result=await call('/ollama/health');els.dot.className='dot ok';els.status.textContent=`Relay ready: ${result.body.configured_model||'model detected'}`;if(!els.model.value&&result.body.configured_model)els.model.placeholder=result.body.configured_model}catch(error){els.dot.className='dot bad';els.status.textContent=`Relay unavailable: ${error.message}`}}async function routes(){els.routes.textContent='Loading route catalog...';try{const result=await call('/ollama');els.routes.replaceChildren(...(result.body.routes||[]).map(route=>{const row=document.createElement('div');row.className='route';row.innerHTML=`<span class="method">${route.method}</span><span class="path">${route.path}</span>`;return row}))}catch(error){els.routes.textContent=`Could not load routes: ${error.message}`}}
    $('#add').addEventListener('click',()=>add());$('#send').addEventListener('click',send);$('#refresh').addEventListener('click',routes);$('#clear').addEventListener('click',()=>{els.messages.replaceChildren();add();els.response.textContent='Send a message to see the Ollama response.';note()});$('#sample').addEventListener('click',()=>{els.messages.replaceChildren();add('system','You are a concise assistant.');add('user','Give me three practical uses for a local language model.')});$('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(els.response.textContent);note('Response JSON copied.')}catch{note('Clipboard access is unavailable.',true)}});[els.model,els.temperature,els.context].forEach(input=>input.addEventListener('input',preview));add();health();routes();
  </script>
</body>
</html>

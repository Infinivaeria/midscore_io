[package]
name = "tiade-maeepers-saerver-all"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-native-tls = "0.5.0"
async-std = { version = "1.13.1", features = ["async-attributes", "async-process", "attributes", "futures-core", "io_safety", "unstable"] }
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["pure-rust-locales", "rkyv-64", "rkyv-validation", "serde"] }
image = { version = "0.25.6", features = ["serde", "color_quant"] }
fast_image_resize = "5.1.2"
magnus = { git = "https://github.com/matsadler/magnus", features = ["embed"] }
native-tls = "0.2.14"
once_cell = "1.21.3"
oneshot = { version = "0.1.11", features = ["loom"] }
serde = "1.0.219"
serde_json = "1.0.140"
rand = "0.8.5"
surf = { version = "2.3.2", default-features = true }
pulldown-cmark = "0.12.2"
minijinja = "2.3.1"

tide = { version = "0.16.0", features = ["docs", "unstable"] }
tide-rustls = "0.3.0"
tiade_ollama_relay = { path = "./tiade_ollama_relay" }
partitioned_array_rust = { path = "../lib/partitioned_array_rust" }
tokio =  { version = "1.44.1", features = ["full"] }
tokio-native-tls = "0.3.1"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v4"] }
serde_yaml = "0.9.34"
regex = "1.13.1"
chrono-tz = "0.10.4"
lazy_static = "1.5.0"
futures-util = "0.3.34"

[profile.dev]
opt-level = 3

[profile.release]
debug = false
opt-level = 3
lto = true
codegen-units = 1
strip = true

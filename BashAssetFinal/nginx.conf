user root;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	multi_accept on;
}

#upstream app {
#  server unix:///root/comicman-remote-modular/config/puma.sock;
#}

http {

upstream app { server unix://root/midscore_web/config/puma.sock; }

server {

	### PageSpeed Module
	#pagespeed on;
	# Needs to exist and be writable by nginx.  Use tmpfs for best performance.
	#pagespeed FileCachePath /var/ngx_pagespeed_cache;

	# Ensure requests for pagespeed optimized resources go to the pagespeed handler
	# and no extraneous headers get set.
	#location ~ "\.pagespeed\.([a-z]\.)?[a-z]{2}\.[^.]{10}\.[^.]+" {
	#add_header "" "";
	#}
	#location ~ "^/pagespeed_static/" { }
	#location ~ "^/ngx_pagespeed_beacon$" { }
	###
	#upstream app { # added
 	#	server unix:///root/comicman-remote-modular/config/puma.sock fail_timeout=0 #added
	#        }
#working on
  	#listen 80;
        #server_name _;
	#return 301 https://$host$request_uri;
###
	server_name artywalf.net www.artywalf.net;
        root /root/CGMFS/public;
	location / {
		proxy_pass http://app;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwaeded-Host 'artywalf.net';
		proxy_set_header X-Forwarded-Proto $scheme;
	}
 	
	#error_page 500 502 503 504 /500.html;
	#error_page 404 /404.html;
	client_max_body_size 4G;
	keepalive_timeout 60;

   # listen [::]:443 ssl ipv6only=on; # managed by Certbot
   # listen 443 ssl; # managed by Certbot
   # ssl_certificate /etc/letsencrypt/live/aritywolf.net/fullchain.pem; # managed by Certbot
   # ssl_certificate_key /etc/letsencrypt/live/aritywolf.net/privkey.pem; # managed by Certbot
  #  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
 #   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




    #listen 443 ssl http2; # managed by Certbot
    #listen [::]:443 ssl http2;
    #ssl_certificate /etc/letsencrypt/live/aritywolf.net/fullchain.pem; # managed by Certbot
    #ssl_certificate_key /etc/letsencrypt/live/aritywolf.net/privkey.pem; # managed by Certbot
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/artywalf.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/artywalf.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}




	
	

     

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	 gzip_vary on;
	 gzip_proxied any;
	 #gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	 #gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	#include /etc/nginx/conf.d/*.conf;
	#include /etc/nginx/sites-enabled/*;

server {
    if ($host = artywalf.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	#server_name artywalf.net;
  #  listen 80 http2;
   # return 404; # managed by Certbot
	
	server_name artywalf.net www.artywalf.net;
	listen 80 default_server;
	server_name _;
	return 301 https://$host$request_uri;

}}


